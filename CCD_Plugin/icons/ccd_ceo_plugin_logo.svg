<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- engranaje: silueta genérica (ícono "settings" estándar), no el arte de Google -->
  <path fill-rule="evenodd" fill="#9e9e9e"
        d="M 24.23 9.29 L 25.46 2.72 L 38.54 2.72 L 39.77 9.29 L 42.56 10.45 L 48.07 6.67 L 57.33 15.93 L 53.55 21.44 L 54.71 24.23 L 61.28 25.46 L 61.28 38.54 L 54.71 39.77 L 53.55 42.56 L 57.33 48.07 L 48.07 57.33 L 42.56 53.55 L 39.77 54.71 L 38.54 61.28 L 25.46 61.28 L 24.23 54.71 L 21.44 53.55 L 15.93 57.33 L 6.67 48.07 L 10.45 42.56 L 9.29 39.77 L 2.72 38.54 L 2.72 25.46 L 9.29 24.23 L 10.45 21.44 L 6.67 15.93 L 15.93 6.67 L 21.44 10.45 Z
           M 17 32 A 15 15 0 1 0 47 32 A 15 15 0 1 0 17 32 Z" />

  <!-- globo propio dentro del hueco del engranaje -->
  <clipPath id="globe-clip"><circle cx="32" cy="32" r="14.5" /></clipPath>
  <g clip-path="url(#globe-clip)">
    <circle cx="32" cy="32" r="14.5" fill="#e8e8e8" />
    <path fill="none" stroke="#3dade9" stroke-width="4.5" stroke-linecap="round" opacity="0.7"
          d="M 12 22 C 20 16 26 28 34 22 C 40 18 46 22 52 16" />
    <path fill="none" stroke="#3dade9" stroke-width="4.5" stroke-linecap="round" opacity="0.7"
          d="M 10 40 C 18 34 24 46 32 40 C 38 36 44 40 50 34" />
  </g>

  <!-- serie caótica (zigzag, no armónica) sobre todo el ícono -->
  <polyline fill="none" stroke="#000000" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"
        points="6,34 12,20 17,40 22,16 28,44 34,22 39,50 45,18 50,36 56,24 62,30" />
  <!-- puntos rojos: inicio y fin de la serie -->
  <circle cx="6" cy="34" r="2.6" fill="#d40000" />
  <circle cx="62" cy="30" r="2.6" fill="#d40000" />
</svg>
